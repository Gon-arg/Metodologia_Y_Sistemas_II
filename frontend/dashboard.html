<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resumen · Finanzas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-fondo font-sans text-tinta md:flex">

  <div id="sidebar" class="md:w-64 md:shrink-0"></div>

  <div class="flex-1 min-w-0">
    <!-- Arriba: ícono redondo con iniciales + desplegable -->
    <div id="navbar"></div>

    <main class="mx-auto max-w-xl px-6 pb-12">
      <h1 class="text-3xl font-extrabold">¡Hola, <span id="nombre-usuario"></span>!</h1>

      <!-- Saldo actual -->
      <form id="saldo-form" class="mt-6" novalidate>
        <label for="saldo-input" class="block text-sm font-semibold text-tinta/70">Ingrese su saldo actual</label>
        <div class="mt-2 flex gap-2">
          <div class="flex flex-1 items-center rounded-lg border border-tinta/15 bg-white focus-within:ring-2 focus-within:ring-verde">
            <span class="pl-3 text-tinta/50 font-semibold">$</span>
            <input id="saldo-input" type="number" step="0.01" inputmode="decimal" placeholder="0,00"
              class="w-full bg-transparent px-2 py-2.5 text-lg font-bold focus:outline-none" />
          </div>
          <button type="submit"
            class="rounded-lg bg-verde hover:bg-verde-osc text-white font-bold px-4 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-verde">
            Guardar
          </button>
        </div>
        <p id="saldo-msg" role="status" hidden class="mt-2 text-sm"></p>
      </form>

      <!-- Gráfico de torta -->
      <section class="mt-8 rounded-2xl bg-white p-6 ring-1 ring-tinta/10">
        <h2 class="text-lg font-bold">Ingreso por categoría</h2>
        <div class="relative mx-auto mt-4 h-72">
          <canvas id="grafico-saldo" role="img" aria-label="Gráfico de torta del saldo por categoría"></canvas>
          <p id="sin-datos" hidden class="absolute inset-0 grid place-items-center text-center text-sm text-tinta/60">
            Todavía no hay saldo para mostrar.<br />Ingresá tu saldo o cargá un ingreso desde Categorías.
          </p>
        </div>
      </section>

      <!-- Total actual -->
      <p class="mt-6 text-center text-xl font-bold">
        Total actual <span id="total-balance" class="text-verde">$ 0,00</span>
      </p>
    </main>
  </div>

  <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
