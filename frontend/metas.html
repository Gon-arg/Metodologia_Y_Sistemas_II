<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metas de ahorro · Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-fondo font-sans text-tinta md:flex">

    <div id="sidebar" class="md:w-64 md:shrink-0"></div>

    <div class="flex-1 min-w-0">
        <div id="navbar"></div>

    <main class="mx-auto max-w-xl px-6 pb-12">
        <h1 class="text-3xl font-extrabold mb-6">Metas de ahorro</h1>

        <!--fForm crear meta nueva -->
            <section class="rounded-2xl bg-white p-6 ring-1 ring-tinta/10 mb-6">
            <h2 class="text-lg font-bold mb-3">Nueva meta</h2>
            <form id="form-meta" class="flex flex-col gap-3">
                <input type="text" id="nombre-meta" placeholder="Nombre de la meta" required
                    class="border border-tinta/15 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-verde" />
            <input type="number" id="monto-objetivo" placeholder="Monto objetivo" step="0.01" required
                class="border border-tinta/15 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-verde" />

            <div class="flex flex-col gap-1">
                <label for="fecha-limite" class="text-sm font-semibold text-tinta/70">¿Hasta cuándo querés ahorrar?</label>
                <input type="date" id="fecha-limite" required
                class="border border-tinta/15 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-verde" />
            </div>

            <button type="submit"
                class="rounded-lg bg-verde hover:bg-verde-osc text-white font-bold px-4 py-2.5 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-verde">
                Crear meta
            </button>
        </form>
    </section>

        <!-- lista de metas -->
        <ul id="lista-metas" class="flex flex-col gap-3"></ul>
        </main>
    </div>

<script type="module" src="js/pages/metas.js"></script>
</body>
</html>
