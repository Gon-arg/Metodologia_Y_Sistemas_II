<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Categorías · Finanzas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { fondo:'#F3F6F2', tinta:'#1B2B27', verde:{DEFAULT:'#0F5C4D',osc:'#0A4136'}, ambar:'#E8A33D', coral:'#D1495B' },
        fontFamily: { sans: ['Manrope','system-ui','sans-serif'] }
      } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-fondo font-sans text-tinta md:flex">

  <div id="sidebar" class="md:w-64 md:shrink-0"></div>

  <div class="flex-1 min-w-0">
    <div id="navbar"></div>

    <main class="mx-auto max-w-xl px-6 pb-12">
      <h1 class="text-3xl font-extrabold">Mis categorías</h1>

      <!-- Botones de categorías + "+" para agregar una nueva -->
      <section class="mt-6" aria-labelledby="t-cats">
        <h2 id="t-cats" class="sr-only">Elegí una categoría</h2>
        <div id="lista-categorias" class="flex flex-wrap gap-2" role="group" aria-label="Categorías"></div>

        <form id="form-categoria" hidden class="mt-3 flex gap-2" novalidate>
          <label for="nombre-categoria" class="sr-only">Nombre de la nueva categoría</label>
          <input id="nombre-categoria" type="text" maxlength="40" placeholder="Nueva categoría"
            class="w-full rounded-lg border border-tinta/15 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-verde" />
          <button type="submit"
            class="shrink-0 rounded-lg bg-verde hover:bg-verde-osc text-white font-bold px-4 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-verde">
            Agregar
          </button>
        </form>
      </section>

      <!-- Movimiento: tipo + monto (va al gráfico del dashboard) -->
      <form id="movimiento-form" class="mt-8 space-y-5 rounded-2xl bg-white p-6 ring-1 ring-tinta/10" novalidate>
        <p id="movimiento-msg" role="status" hidden class="rounded-lg px-3 py-2 text-sm"></p>

        <p class="text-sm text-tinta/70">Categoría elegida: <strong id="categoria-elegida">ninguna</strong></p>

        <fieldset>
          <legend class="mb-1 text-sm font-semibold">Tipo de movimiento</legend>
          <div class="grid grid-cols-2 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="tipo" value="gasto" class="peer sr-only" checked />
              <span class="block rounded-lg border border-tinta/15 py-2.5 text-center font-semibold peer-checked:border-coral peer-checked:bg-coral peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-verde">Gasto</span>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="tipo" value="ingreso" class="peer sr-only" />
              <span class="block rounded-lg border border-tinta/15 py-2.5 text-center font-semibold peer-checked:border-verde peer-checked:bg-verde peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-verde">Ingreso</span>
            </label>
          </div>
        </fieldset>

        <div>
          <label for="monto" class="mb-1 block text-sm font-semibold">Monto</label>
          <div class="flex items-center rounded-lg border border-tinta/15 focus-within:ring-2 focus-within:ring-verde">
            <span class="pl-3 font-semibold text-tinta/50">$</span>
            <input id="monto" type="number" min="0.01" step="0.01" inputmode="decimal"
              class="w-full bg-transparent px-2 py-2.5 focus:outline-none" />
          </div>
        </div>

        <button type="submit"
          class="w-full rounded-lg bg-verde hover:bg-verde-osc text-white font-bold py-2.5 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-verde">
          Guardar movimiento
        </button>
      </form>
    </main>
  </div>

  <script type="module" src="js/pages/categorias.js"></script>
</body>
</html>
