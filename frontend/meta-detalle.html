<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Detalle de meta</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

<!-- Detalle de una meta + sus aportes (?id= en la URL). Requiere sesion -->
<div class="max-w-2xl mx-auto px-4 py-8">

    <!-- Card principal de la meta -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
        <h2 id="nombre-meta-titulo" class="text-2xl font-bold text-gray-800 mb-4"></h2>

        <!-- Monto objetivo -->
        <p id="monto-objetivo-meta" class="text-gray-600 mb-1"></p>

        <!-- Fechas -->
        <div class="flex justify-between text-sm text-gray-500 mb-4">
            <span id="fecha-inicio-meta"></span>
            <span id="fecha-limite-meta"></span>
        </div>

        <!-- Barra de progreso -->
        <div class="w-full bg-gray-200 rounded-full h-4 mb-1 overflow-hidden">
            <div id="barra-progreso" class="bg-green-500 h-4 rounded-full transition-all" style="width: 0%"></div>
        </div>
        <p id="tiempo-restante-meta" class="text-sm text-gray-500 mb-4"></p>

        <!-- Estado actual: objetivo (izq) / recaudado (der) -->
        <div class="flex justify-between items-center border-t pt-4">
            <div>
                <p class="text-xs text-gray-400 uppercase">Objetivo</p>
                <p id="monto-objetivo-estado" class="text-lg font-semibold text-gray-700"></p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400 uppercase">Recaudado</p>
                <p id="monto-actual-estado" class="text-lg font-semibold text-green-600"></p>
            </div>
        </div>
    </div>

    <!-- Form nuevo aporte -->
    <div class="bg-white rounded-xl shadow p-6 mb-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">Agregar aporte</h3>
        <form id="form-aporte" class="flex flex-col gap-3">
            <input
                type="number"
                id="monto-aporte"
                placeholder="Monto del aporte"
                step="0.01"
                required
                class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"
            />
            <input
                type="text"
                id="descripcion-aporte"
                placeholder="Descripción (opcional)"
                class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"
            />
            <button
                type="submit"
                class="bg-green-500 hover:bg-green-600 text-white font-medium rounded-lg px-4 py-2 transition-colors"
            >
                Agregar aporte
            </button>
        </form>
    </div>

    <!-- Lista de aportes -->
    <div class="bg-white rounded-xl shadow p-6">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">Aportes</h3>
        <ul id="lista-aportes" class="flex flex-col gap-2"></ul>
    </div>

</div>

<script type="module" src="js/pages/metaDetalle.js"></script>
</body>
</html>
