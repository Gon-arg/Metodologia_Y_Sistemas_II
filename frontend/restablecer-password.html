<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restablecer contraseña · Finanzas</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body class="min-h-screen bg-fondo font-sans text-tinta grid md:grid-cols-2">

<aside class="hidden md:flex flex-col justify-between bg-verde text-white p-12">
    <span class="text-xl font-extrabold tracking-tight">Finanzas</span>
    <div>
    <p class="text-4xl font-extrabold leading-tight max-w-sm">Creá tu nueva contraseña.</p>
    </div>
    <span class="text-sm text-white/50">Metodología de Sistemas II</span>
</aside>

<main class="flex items-center justify-center p-6">
    <form id="restablecer-form" class="w-full max-w-sm space-y-5" novalidate>
    <div>
        <h1 class="text-2xl font-extrabold">Nueva contraseña</h1>
        <p class="text-sm text-tinta/60 mt-1">Elegí una contraseña nueva para tu cuenta.</p>
    </div>

    <p id="restablecer-error" role="alert" hidden class="rounded-lg bg-coral/10 text-coral text-sm px-3 py-2"></p>
    <p id="restablecer-exito" role="status" hidden class="rounded-lg bg-verde/10 text-verde text-sm px-3 py-2"></p>

    <div>
        <label for="nueva-password" class="block text-sm font-semibold mb-1">Contraseña nueva</label>
        <input id="nueva-password" name="nueva-password" type="password" autocomplete="new-password" required minlength="6"
        class="w-full rounded-lg border border-tinta/15 bg-white px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-verde focus:border-verde" />
        <p class="text-xs text-tinta/50 mt-1">Mínimo 6 caracteres.</p>
    </div>

    <button type="submit" id="btn-restablecer"
        class="w-full rounded-lg bg-verde hover:bg-verde-osc text-white font-bold py-2.5 transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-verde">
        Guardar contraseña
    </button>
    </form>
</main>

<script type="module" src="js/pages/restablecerPassword.js"></script>
</body>
</html>
